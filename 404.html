<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена 404 | Мои задачи</title>
    <meta name="description" content="Страница не найдена. Вернитесь на главную или воспользуйтесь списком дел.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #153677, #4e085f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 { font-size: 80px; color: #153677; margin-bottom: 10px; }
        h2 { font-size: 24px; margin-bottom: 20px; color: #333; }
        p { margin-bottom: 15px; color: #666; }
        a {
            display: inline-block;
            background: #153677;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.3s;
        }
        a:hover { background: #0f2a55; }
        ul { text-align: left; margin: 20px 0; padding-left: 20px; }
        li { margin: 8px 0; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>К сожалению, такой страницы не существует.</p>
        <p>Возможно, вы искали:</p>
        <ul>
            <li>🎯 <strong>Онлайн список задач</strong> — главная страница</li>
            <li>📝 <strong>Todo лист</strong> для ежедневных дел</li>
            <li>✅ <strong>Планировщик задач</strong> без регистрации</li>
        </ul>
        <a href="https://uli-vav.github.io/">↩️ Вернуться на главную</a>
    </div>
</body>
</html>
